name: Publish an approved community lot

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  actions: write

concurrency:
  group: community-lots
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'city:approved' && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the trusted city build
        run: npm ci
      - name: Import the owner-approved event snapshot
        id: import
        run: node scripts/publish-community-lot.js --event "$GITHUB_EVENT_PATH"
      - name: Verify the updated city
        if: steps.import.outputs.changed == 'true'
        run: |
          npm test
          npm run build
      - name: Commit the approved metadata
        if: steps.import.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/projects.json public/city-activity.json
          git commit -m "Publish approved community lot from issue event"
          git push origin HEAD:main
      - name: Deploy the approved lot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
