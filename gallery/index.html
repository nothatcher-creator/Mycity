<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171f32" />
    <title>Nothatcher's Gallery — Mycity</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header>
      <a href="../">← MYCITY</a><span>ART & IMAGES / LOT 009</span
      ><a id="add-art" target="_blank" rel="noopener noreferrer"
        >Add your art +</a
      >
    </header>
    <main>
      <p class="eyebrow">FROM THE WORLDS I MAKE</p>
      <h1>A little imagination.<br /><em>A place to keep it.</em></h1>
      <p class="intro">
        Original artwork from my projects. A city full of games deserves a
        gallery of its own.
      </p>
      <section id="art-grid" aria-label="Artwork collection"></section>
      <p id="gallery-notice" role="status" hidden></p>
    </main>
    <footer>
      <span>NOTHATCHER / MYCITY</span
      ><span>There’s room for your art in the neighborhood.</span>
    </footer>
    <dialog id="art-dialog" aria-labelledby="art-title">
      <button id="art-close" type="button" aria-label="Close artwork">×</button
      ><img id="art-full" alt="" />
      <div>
        <h2 id="art-title"></h2>
        <p id="art-caption"></p>
        <a id="art-source" target="_blank" rel="noopener noreferrer"
          >Visit the original project →</a
        >
      </div>
    </dialog>
    <script type="module" src="/src/gallery.js"></script>
  </body>
</html>
