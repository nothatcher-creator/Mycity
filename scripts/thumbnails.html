<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mycity thumbnail renderer</title>
  </head>
  <body style="margin: 0; background: #24494f">
    <!-- Development-only page driven by scripts/render-thumbnails.mjs; not part of the site build. -->
    <canvas id="stage" width="720" height="320"></canvas>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      const canvas = document.getElementById("stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(720, 320, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      const scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.55;
      scene.add(new THREE.HemisphereLight(0xb8d3f0, 0x665c45, 0.6));
      const sun = new THREE.DirectionalLight(0xffd6a3, 2.6);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.normalBias = 0.03;
      scene.add(sun, sun.target);
      const catcher = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200).rotateX(-Math.PI / 2),
        new THREE.ShadowMaterial({ opacity: 0.28 }),
      );
      catcher.receiveShadow = true;
      scene.add(catcher);
      const camera = new THREE.PerspectiveCamera(26, 720 / 320, 0.1, 500);
      const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);

      window.renderThumbnail = async (url) => {
        const gltf = await loader.loadAsync(url);
        const model = gltf.scene;
        model.traverse((part) => {
          if (part.isMesh) part.castShadow = part.receiveShadow = true;
        });
        model.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        // Same normalization as the city: the footprint fills a 13.8 m lot.
        const scale = Math.min(13.8 / Math.max(size.x, 0.01), 13.8 / Math.max(size.z, 0.01), 19 / Math.max(size.y, 0.01));
        model.scale.multiplyScalar(scale);
        model.position.set(-((box.min.x + box.max.x) * scale) / 2, -box.min.y * scale, -((box.min.z + box.max.z) * scale) / 2);
        scene.add(model);
        model.updateMatrixWorld(true);
        const fitted = new THREE.Box3().setFromObject(model);
        const sphere = fitted.getBoundingSphere(new THREE.Sphere());
        const direction = new THREE.Vector3(0.62, 0.42, 0.88).normalize();
        const distance = sphere.radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.98;
        camera.position.copy(sphere.center).addScaledVector(direction, distance);
        camera.lookAt(sphere.center);
        sun.target.position.copy(sphere.center);
        sun.position.copy(sphere.center).add(new THREE.Vector3(-30, 40, 34));
        Object.assign(sun.shadow.camera, { left: -sphere.radius * 1.4, right: sphere.radius * 1.4, top: sphere.radius * 1.4, bottom: -sphere.radius * 1.4, near: 1, far: 200 });
        sun.shadow.camera.updateProjectionMatrix();
        renderer.render(scene, camera);
        const image = canvas.toDataURL("image/webp", 0.86);
        scene.remove(model);
        model.traverse((part) => {
          part.geometry?.dispose();
          for (const material of [part.material].flat().filter(Boolean)) {
            for (const value of Object.values(material)) if (value?.isTexture) value.dispose();
            material.dispose();
          }
        });
        return image;
      };
      window.thumbnailRendererReady = true;
    </script>
  </body>
</html>
